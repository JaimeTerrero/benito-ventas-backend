quarkus.http.port=8081
quarkus.http.test-port=8082

%dev.quarkus.mongodb.connection-string=mongodb://localhost:27017/?replicaSet=rs0&directConnection=true
%dev.quarkus.mongodb.database=benito_orders

%dev.kafka.bootstrap.servers=localhost:9092

mp.messaging.outgoing.orders-created-out.connector=smallrye-kafka
mp.messaging.outgoing.orders-created-out.topic=orders-created
mp.messaging.outgoing.orders-created-out.value.serializer=io.quarkus.kafka.client.serialization.ObjectMapperSerializer
mp.messaging.outgoing.orders-created-out.acks=all

mp.messaging.incoming.orders-processed-in.connector=smallrye-kafka
mp.messaging.incoming.orders-processed-in.topic=orders-processed
mp.messaging.incoming.orders-processed-in.group.id=orders-service
mp.messaging.incoming.orders-processed-in.auto.offset.reset=earliest
mp.messaging.incoming.orders-processed-in.value.deserializer=com.benitoventas.OrderProcessedEventDeserializer

mp.jwt.verify.issuer=https://benito-ventas.local
mp.jwt.verify.audiences=benito-ventas-api
%dev.mp.jwt.verify.publickey.location=../secrets/publicKey.pem

quarkus.security.jaxrs.deny-unannotated-endpoints=true

quarkus.http.ssl-port=8444
quarkus.http.test-ssl-port=8544
quarkus.http.insecure-requests=disabled

quarkus.http.tls-configuration-name=web

quarkus.tls.web.key-store.p12.path=../secrets/tls/orders-service.p12
quarkus.tls.web.key-store.p12.password=local-dev-only

quarkus.tls.web.trust-store.p12.path=../secrets/tls/truststore.p12
quarkus.tls.web.trust-store.p12.password=local-dev-only

quarkus.http.ssl.client-auth=request
quarkus.smallrye-jwt.priority=2001

kafka.security.protocol=SSL
kafka.tls-configuration-name=broker

quarkus.tls.broker.key-store.p12.path=../secrets/tls/orders-service.p12
quarkus.tls.broker.key-store.p12.password=local-dev-only

quarkus.tls.broker.trust-store.p12.path=../secrets/tls/truststore.p12
quarkus.tls.broker.trust-store.p12.password=local-dev-only
quarkus.tls.broker.hostname-verification-algorithm=HTTPS

quarkus.mongodb.tls-configuration-name=database

quarkus.tls.database.key-store.p12.path=../secrets/tls/orders-service.p12
quarkus.tls.database.key-store.p12.password=local-dev-only

quarkus.tls.database.trust-store.p12.path=../secrets/tls/truststore.p12
quarkus.tls.database.trust-store.p12.password=local-dev-only
quarkus.tls.database.hostname-verification-algorithm=HTTPS